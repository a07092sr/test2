                        src="../img/icons/material-symbols--close-rounded.svg" alt="閉じる" aria-label="メニューを閉じる"

            <nav class="nav">

                    <li><a href="../index.html#top" class="gnav__link">トップ</a></li>

                <ul class="link">
                    <li class="twitter"><a href="#" class="icon__sns"><img src="../img/icons/proicons--x-twitter.svg"

        </header>
        <!-- ヘッダー兼サイドバーここまで -->

        <!-- メインエリア（メインコンテンツ＋フッター） -->
        <div class="main-area">

            <!-- メインコンテンツ -->
            <main class="main-content">
                <section id="contactForm" class="fade-up">
                    <h2>お問い合わせフォーム</h2>
                    <p>ご不明点がございましたら以下のフォームよりお問い合わせください。</p>
                    <form action="#" id="form" class="input-form">
                        <div class="input-item">
                            <label for="name">お名前</label>
                            <input type="text" name="name" id="name" class="input-field" placeholder="姓　名" required>
                        </div>
                        <div class="input-item">
                            <label for="email">メールアドレス</label>
                            <input type="email" name="email" id="email" class="input-field" placeholder="email@email.com" required>
                        </div>
                        <div class="input-item">
                            <label for="subject">件名</label>
                            <input type="text" name="subject" id="subject" class="input-field" placeholder="お問い合わせ件名">
                        </div>
                        <div class="input-item">
                            <label for="message">お問い合わせ内容</label>
                            <textarea name="message" id="message" rows="8" class="input-field" placeholder="お問い合わせ内容を入力してください" required></textarea>
                        </div>
                        <button type="submit" class="btn __submit">送信する</button>
                    </form>
                </section>


                <nav class="lnav">
                    <ul class="lnav__list">
                        <li><a href="../index.html" class="lnav__icon"><img src="../img/icons/material-symbols--family-home-rounded.svg" alt="ホーム"></a></li>
                        <li>お問い合わせフォーム</li>
                    </ul>
                </nav>
            </main>
            <!-- メインコンテンツここまで -->

            <!-- フッター -->
            <footer>
                <ul class="link">
                    <li class="twitter"><a href="#" class="icon__sns"><img src="../img/icons/proicons--x-twitter.svg"

                    <li class="instagram"><a href="#" class="icon__sns"><img src="../img/icons/proicons--instagram.svg"
                                alt="instagram" class="icon__img"></a></li>
                    <li class="tiktok"><a href="#" class="icon__sns"><img src="../img/icons/proicons--tiktok.svg"
                                alt="tiktok" class="icon__img"></a></li>

                    </li>
                </ul>
                <small>
                    <ul class="policy">

                    aria-label="トップへ戻る">
            </button>
